name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          code=$?
          # tampilkan error kompilasi sebagai anotasi supaya mudah dibaca
          grep -E "^e: |What went wrong|error:|Could not|Unresolved|FAILED" -A3 build.log | head -80 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: Downloader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
